name: Import upstream repository
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  import:
    if: github.event.head_commit.message == 'Add upstream import workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import upstream snapshot
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -L --fail "https://github.com/pedrozanela/Databricks-Master-Training/archive/refs/heads/main.zip" -o "$tmp/upstream.zip"
          unzip -q "$tmp/upstream.zip" -d "$tmp"
          src="$tmp/Databricks-Master-Training-main"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$src"/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Databricks-Master-Training upstream snapshot"
          git push origin main
